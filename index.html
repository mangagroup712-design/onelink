<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneLink — URL を短く、きれいに</title>
    <meta
      name="description"
      content="長い URL を短いリンクに変換。1.max7.work/XXXXXX で共有できます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OneLink" />
    <meta property="og:title" content="OneLink — URL を短く、きれいに" />
    <meta
      property="og:description"
      content="長い URL を短いリンクに変換。1.max7.work/XXXXXX で共有できます。"
    />
    <meta property="og:url" content="https://1lk.f5.si/" />
    <meta property="og:image" content="https://1lk.f5.si/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OneLink — URL を短く、きれいに" />
    <meta
      name="twitter:description"
      content="長い URL を短いリンクに変換。1.max7.work/XXXXXX で共有できます。"
    />
    <meta name="twitter:image" content="https://1lk.f5.si/og.png" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="page">
      <main class="hero">
        <p class="brand">OneLink</p>
        <h1 class="headline">長いリンクを、一息で渡せる形に。</h1>
        <p class="lede">
          URL を貼り付けて短縮。生成された短縮リンク
          <span class="mono">1.max7.work/…</span>
          はどのデバイスからでも使えます。カスタムコードにも対応。
        </p>

        <div class="form-shell">
          <form id="shorten-form" class="shorten-form" novalidate>
            <label class="sr-only" for="url">長い URL</label>
            <div class="input-row">
              <input
                id="url"
                name="url"
                type="text"
                inputmode="url"
                autocomplete="url"
                placeholder="https://example.com/very/long/path"
                required
              />
              <button type="submit" id="submit-btn">短縮する</button>
            </div>

            <button type="button" class="custom-toggle" id="custom-toggle">
              カスタムコードを使う
            </button>

            <label class="custom-field hidden" id="custom-field">
              <span>カスタムコード（1〜6文字の英数字、大文字小文字を区別）</span>
              <input
                id="custom-code"
                type="text"
                placeholder="my-link"
                maxlength="6"
                pattern="[A-Za-z0-9]{1,6}"
              />
            </label>
          </form>

          <p id="banner" class="banner hidden" role="status"></p>

          <div id="result" class="result hidden" aria-live="polite">
            <p class="result-label">短縮リンクの準備ができました</p>
            <div class="result-row">
              <a id="short-url" href="#" target="_blank" rel="noopener noreferrer"
                ></a
              >
              <button type="button" id="copy-btn">コピー</button>
            </div>
            <p class="result-meta" id="result-meta"></p>
            <div class="result-actions">
              <button type="button" id="download-btn" class="btn-secondary hidden">
                公開用ファイルをダウンロード
              </button>
            </div>
          </div>
        </div>
      </main>

      <footer class="site-footer">
        <p>OneLink - URL短縮</p>
      </footer>
    </div>

    <script type="module" src="/js/redirect.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
